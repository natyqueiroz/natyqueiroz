# Gera o Pac-Man que "come" o gráfico de contribuições do GitHub.
# Roda sozinho uma vez por dia, a cada push na main, ou manualmente (aba Actions).
name: gerar pacman

on:
  schedule:
    - cron: '0 3 * * *'   # todo dia às 03:00 UTC (meia-noite em São Paulo)
  workflow_dispatch:      # botão "Run workflow" na aba Actions
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write     # precisa de permissão para gravar na branch "output"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: gerar o SVG do pac-man
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: publicar o SVG na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
